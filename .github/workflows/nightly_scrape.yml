name: Actualizar datos MadPlan

# Presupuesto (GitHub Pro, repo privado): 3.000 min/mes de Actions.
# Este workflow corre 1 vez al día con tope duro de 45 min:
#   peor caso 45 x 31 = 1.395 min/mes (~46% del presupuesto).
# En la práctica una ejecución normal tarda 12-20 min.
on:
  schedule:
    # Cron en UTC: 04:15 UTC = 06:15 Madrid (verano). Minuto impar para
    # evitar los picos en punta de hora de GitHub.
    - cron: "15 4 * * *"
  workflow_dispatch:
    inputs:
      fever_mode:
        description: "Modo Fever (full resuelve coordenadas, fast no)"
        type: choice
        default: full
        options: [full, fast]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: madplan-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restaurar outputs por fuente (último dato bueno)
        uses: actions/cache/restore@v4
        with:
          path: |
            outputs/eventos_*.json
            outputs/noticias_timeout.json
            outputs/noticias_gacetin_madrid.json
          key: madplan-sources-${{ github.run_id }}
          restore-keys: |
            madplan-sources-

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Cache de navegadores Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Instalar Chromium
        run: python -m playwright install --with-deps chromium

      - name: Ejecutar pipeline
        env:
          MAD_PLAN_TRIGGER_TYPE: scheduled
          MAD_PLAN_TRIGGER_SOURCE: github-actions
          MAD_PLAN_TRIGGER_SCHEDULE: "15 4 * * * UTC"
          MAD_PLAN_FEVER_MODE: ${{ inputs.fever_mode || 'full' }}
        run: python tools/daily_trigger.py

      - name: Guardar outputs por fuente en cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            outputs/eventos_*.json
            outputs/noticias_timeout.json
            outputs/noticias_gacetin_madrid.json
          key: madplan-sources-${{ github.run_id }}

      - name: Publicar feeds web en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/eventos_web.json outputs/noticias_web.json outputs/pipeline_diario.json outputs/geocode_cache.json
          # Respaldo versionado de las fuentes que bloquean IPs de datacenter:
          # si el runner logró scrapearlas, se refrescan; si no, quedan como están.
          git add -f outputs/eventos_eventbrite.json outputs/eventos_ticketmaster.json outputs/eventos_biblioteca_nacional.json || true
          if git diff --cached --quiet; then
            echo "Sin cambios en los feeds; no se crea commit."
            exit 0
          fi
          git commit -m "data: actualización diaria de feeds"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}

  # El push del bot no dispara otros workflows, así que la web se
  # redespliega aquí mismo con los datos frescos. Si Pages aún no está
  # activado en Settings, este job falla sin afectar a los datos
  # (continue-on-error).
  deploy-web:
    needs: scrape
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (con los feeds recién publicados)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend_new/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend_new
        run: npm ci

      - name: Build
        working-directory: frontend_new
        run: npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend_new/dist

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
