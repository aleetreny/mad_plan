name: Desplegar web (GitHub Pages)

# Se dispara al hacer push de código a main y a mano. Los commits diarios de
# datos del bot NO disparan este workflow (GitHub no encadena workflows del
# GITHUB_TOKEN); por eso el workflow nocturno tiene su propio job de deploy.
#
# Requisito único (una vez): Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend_new/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend_new
        run: npm ci

      - name: Build
        working-directory: frontend_new
        run: npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend_new/dist

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
